name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py313-

      - name: Install all dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

  tests:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
          include:
          - config: core
            extras: ""
            collect-coverage: false
          - config: pydantic
            extras: "pydantic"
            collect-coverage: true
    name: Test (${{ matrix.config }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py313-${{ matrix.config }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py13-${{ matrix.config }}-

      - name: Install dependencies and project
        run: |
          if [ -n "${{ matrix.extras }}" ]; then
            uv sync --frozen --dev --extra ${{ matrix.extras }}
          else
            uv sync --frozen --dev
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.collect-coverage }}" = "true" ]; then
            uv run pytest \
              --cov=src \
              --cov-report=xml \
              --cov-report=term-missing \
              --cov-fail-under=90 \
              -v
          else
            uv run pytest -v
          fi

      - name: Upload coverage to Codecov
        if: matrix.collect-coverage == true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
