name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe the problem and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like to see this implemented?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Usage context
      description: How would this feature be used in real-world scenarios?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution willingness
      options:
        - label: I'm willing to implement this feature and submit a PR
          required: false
