name: Internal Task
description: Internal roadmap task
title: "[Internal]: "
labels: ["roadmap"]

body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be implemented?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - resolver
        - planner
        - generator
        - constraints
        - parsing
        - api
        - pytest
        - docs
        - ci

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation notes

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define the conditions that must be met for this task to be considered complete.
      value: |
        - [ ] Tests added/updated
        - [ ] Documentation (README/docs) updated
        - [ ] CHANGELOG updated
        - [ ] Code reviewed and merged
    validations:
      required: true
